<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seu código de acesso</title>
  </head>
  <body style="margin:0;background:#f4f4f5;font-family:Arial,sans-serif;color:#18181b">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding:40px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="max-width:520px;background:#ffffff;border-radius:12px"
          >
            <tr>
              <td style="padding:32px">
                <h1 style="margin:0 0 16px;font-size:24px">Seu código de acesso</h1>
                <p style="margin:0 0 24px;line-height:1.5">
                  Use o código abaixo para entrar no Indica Aí:
                </p>
                <p
                  style="margin:0 0 24px;font-size:32px;font-weight:700;letter-spacing:6px;text-align:center"
                >
                  {{ .Token }}
                </p>
                <p style="margin:0;color:#52525b;line-height:1.5">
                  O código expira em 5 minutos. Se você não solicitou este acesso,
                  ignore este e-mail.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

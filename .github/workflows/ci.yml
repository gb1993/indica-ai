name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_only
      RESEND_FROM_EMAIL: ci@example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

  database:
    name: Database migrations, RLS and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject changes to existing migrations
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          invalid_migrations="$(
            git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- supabase/migrations \
              | awk '$1 !~ /^A/ { print }'
          )"

          if [ -n "$invalid_migrations" ]; then
            echo "::error::Existing migrations cannot be changed or removed. Create a new migration instead."
            printf '%s\n' "$invalid_migrations"
            exit 1
          fi

      - name: Start reduced Supabase stack
        run: npx supabase start -x analytics,vector,realtime,edge-runtime,functions,studio,meta,imgproxy

      - name: Replay migrations and seed
        run: npx supabase db reset

      - name: Run database tests
        run: npm run test:db

      - name: Lint database schemas
        run: npx supabase db lint --local --level warning --fail-on warning

      - name: Stop Supabase stack
        if: always()
        run: npx supabase stop --no-backup
